<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Lead generation process illustration</title>
  <desc id="desc">A four-step pipeline from campaign to enquiry to qualification to referral.</desc>
  <rect width="1000" height="640" rx="36" fill="#f4f8fa"/>
  <path d="M118 320 H880" stroke="#d8e4ea" stroke-width="16" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80,230)">
      <circle cx="90" cy="90" r="76" fill="#0f6d61"/>
      <text x="90" y="83" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">01</text>
      <text x="90" y="112" text-anchor="middle" font-size="16" fill="#dff8f2">Campaign</text>
      <text x="90" y="205" text-anchor="middle" font-size="20" fill="#163b4a" font-weight="700">Reach</text>
    </g>
    <g transform="translate(300,230)">
      <circle cx="90" cy="90" r="76" fill="#2d8e80"/>
      <text x="90" y="83" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">02</text>
      <text x="90" y="112" text-anchor="middle" font-size="16" fill="#eafaf6">Enquiry</text>
      <text x="90" y="205" text-anchor="middle" font-size="20" fill="#163b4a" font-weight="700">Engage</text>
    </g>
    <g transform="translate(520,230)">
      <circle cx="90" cy="90" r="76" fill="#387fa8"/>
      <text x="90" y="83" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">03</text>
      <text x="90" y="112" text-anchor="middle" font-size="16" fill="#edf7fd">Qualify</text>
      <text x="90" y="205" text-anchor="middle" font-size="20" fill="#163b4a" font-weight="700">Match</text>
    </g>
    <g transform="translate(740,230)">
      <circle cx="90" cy="90" r="76" fill="#153a56"/>
      <text x="90" y="83" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">04</text>
      <text x="90" y="112" text-anchor="middle" font-size="16" fill="#e8f3fa">Referral</text>
      <text x="90" y="205" text-anchor="middle" font-size="20" fill="#163b4a" font-weight="700">Connect</text>
    </g>
  </g>
</svg>
